!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYTKARINO RP — Официальный сайт</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0d10;
            color: #ffffff;
            line-height: 1.6;
            font-size: 18px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 100px;
            background: rgba(15, 18, 24, 0.95);
            border-bottom: 1px solid #1f2630;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .logo-block {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-img {
            height: 45px;
            width: auto;
            display: none;
        }
        .logo-text {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 1.5px;
        }
        .logo-white { color: #ffffff; }
        .logo-green { color: #2ecc71; }

        nav a {
            color: #a0a8b5;
            text-decoration: none;
            margin-left: 35px;
            font-weight: 600;
            font-size: 18px;
            transition: 0.3s;
        }
        nav a:hover { color: #2ecc71; }

        .hero {
            text-align: center;
            padding: 130px 20px;
            background: radial-gradient(circle, rgba(46,204,113,0.12) 0%, rgba(11,13,16,1) 75%);
        }
        .hero h1 {
            font-size: 56px;
            margin-bottom: 20px;
            font-weight: 800;
        }
        .hero p {
            color: #8a94a6;
            font-size: 22px;
            max-width: 750px;
            margin: 0 auto 40px;
        }
        .btn {
            background: #2ecc71;
            color: #0b0d10;
            padding: 18px 45px;
            text-decoration: none;
            font-weight: 800;
            border-radius: 10px;
            font-size: 20px;
            transition: 0.3s;
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.35);
            display: inline-block;
        }
        .btn:hover {
            background: #27ae60;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(46, 204, 113, 0.5);
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
            padding: 70px 25px;
        }
        .section-title {
            font-size: 34px;
            margin-bottom: 35px;
            border-left: 5px solid #2ecc71;
            padding-left: 18px;
            font-weight: 700;
        }

        /* Сервера */
        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 70px;
        }
